# Production stack on nuncio-vultr, behind Coolify's Traefik (which owns 80/443).
# Traefik terminates TLS for bothy.trustfall.xyz and forwards plain HTTP to the
# bundled Caddy, which keeps the invite gate and /idp routing (Caddyfile.prod).
# Containers that call the public hostname (OIDC code exchange, JWKS fetch)
# hairpin out through Traefik like any other client — no internal alias.
#
# Always run with an explicit project name; on this host the default name
# "deploy" is already used by another app:
#   cd deploy && docker compose -p bothy -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  graph:
    build:
      context: ..
      dockerfile: deploy/graph/Dockerfile
    container_name: bothy-graph
    restart: unless-stopped
    volumes:
      - ../graphs:/turing/graphs
    networks:
      - bothy-internal

  idp:
    build:
      context: ..
      dockerfile: deploy/idp/Dockerfile
    container_name: bothy-idp
    restart: unless-stopped
    env_file:
      - .env.sso
    volumes:
      - bothy-idp-data:/data
    networks:
      - bothy-internal

  agent:
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    container_name: bothy-agent
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.sso
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Neon pooled URL) in .env.production}
      PORT: "8787"
      BOTHY_DATA_DIR: /app/data
      TURING_SIDECAR_URL: http://graph:6778
    volumes:
      - bothy-agent-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - bothy-internal

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        AGENT_URL: http://agent:8787
    container_name: bothy-web
    restart: unless-stopped
    env_file:
      - .env.sso
    environment:
      AGENT_URL: http://agent:8787
      PUBLIC_WEB_URL: https://${BOTHY_DOMAIN:-bothy.trustfall.xyz}
      NODE_ENV: production
    depends_on:
      - agent
    networks:
      - bothy-internal

  caddy:
    image: caddy:2
    container_name: bothy-caddy
    restart: unless-stopped
    environment:
      BOTHY_DOMAIN: ${BOTHY_DOMAIN:-bothy.trustfall.xyz}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./invite.caddy:/etc/caddy/invite:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    networks:
      - bothy-internal
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.bothy-prod.rule: "Host(`${BOTHY_DOMAIN:-bothy.trustfall.xyz}`)"
      traefik.http.routers.bothy-prod.entrypoints: https
      traefik.http.routers.bothy-prod.tls: "true"
      traefik.http.routers.bothy-prod.tls.certresolver: letsencrypt
      traefik.http.routers.bothy-prod-http.rule: "Host(`${BOTHY_DOMAIN:-bothy.trustfall.xyz}`)"
      traefik.http.routers.bothy-prod-http.entrypoints: http
      traefik.http.routers.bothy-prod-http.middlewares: bothy-prod-https
      traefik.http.middlewares.bothy-prod-https.redirectscheme.scheme: https
      traefik.http.services.bothy-prod.loadbalancer.server.port: "80"

networks:
  bothy-internal:
    driver: bridge
  coolify:
    external: true

volumes:
  bothy-agent-data:
  bothy-idp-data:
  caddy-data:
  caddy-config:
