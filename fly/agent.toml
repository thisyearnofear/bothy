app = "bothy-agent"
primary_region = "lax"

[build]

[deploy]
  release_command = "npm run seed"

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[ mounts ]]
  source = "agent_data"
  destination = "/app/data"
