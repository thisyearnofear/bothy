# Self-contained demo stack: Caddy (auto-HTTPS) -> web -> agent -> PostGIS.
# Only Caddy publishes ports (80/443); nothing else is reachable from outside.
# Run from deploy/:  docker compose -f docker-compose.demo.yml --env-file .env.production up -d --build
services:
  db:
    image: postgis/postgis:16-3.5
    container_name: bothy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bothy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: bothy
    volumes:
      - bothy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bothy -d bothy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bothy-demo

  graph:
    build:
      context: ..
      dockerfile: deploy/graph/Dockerfile
    container_name: bothy-graph
    restart: unless-stopped
    volumes:
      - ../graphs:/turing/graphs
    networks:
      - bothy-demo

  idp:
    build:
      context: ..
      dockerfile: deploy/idp/Dockerfile
    container_name: bothy-idp
    restart: unless-stopped
    env_file:
      - .env.sso
    volumes:
      - bothy-idp-data:/data
    networks:
      - bothy-demo

  agent:
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    container_name: bothy-agent
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.sso
    environment:
      DATABASE_URL: postgres://bothy:${POSTGRES_PASSWORD}@db:5432/bothy
      PORT: "8787"
      BOTHY_DATA_DIR: /app/data
      TURING_SIDECAR_URL: http://graph:6778
    volumes:
      - bothy-agent-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - bothy-demo

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        AGENT_URL: http://agent:8787
    container_name: bothy-web
    restart: unless-stopped
    env_file:
      - .env.sso
    environment:
      AGENT_URL: http://agent:8787
      PUBLIC_WEB_URL: https://${BOTHY_DOMAIN:-bothy.trustfall.xyz}
      NODE_ENV: production
    depends_on:
      - agent
    networks:
      - bothy-demo

  caddy:
    image: caddy:2
    container_name: bothy-caddy
    restart: unless-stopped
    environment:
      BOTHY_DOMAIN: ${BOTHY_DOMAIN:-bothy.trustfall.xyz}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./invite.caddy:/etc/caddy/invite:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    networks:
      bothy-demo:
        # Containers (web code exchange, agent JWKS fetch) reach the public
        # hostname through Caddy instead of hairpinning via the host IP.
        aliases:
          - ${BOTHY_DOMAIN:-bothy.trustfall.xyz}

networks:
  bothy-demo:
    driver: bridge

volumes:
  bothy-pgdata:
  bothy-agent-data:
  bothy-idp-data:
  caddy-data:
  caddy-config:
