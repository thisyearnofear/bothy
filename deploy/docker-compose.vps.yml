services:
  agent:
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    container_name: bothy-agent
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - coolify
      - bothy-internal
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.bothy-api.rule: "Host(`api.bothy.trustfall.xyz`)"
      traefik.http.routers.bothy-api.entrypoints: https
      traefik.http.routers.bothy-api.tls: "true"
      traefik.http.routers.bothy-api.tls.certresolver: letsencrypt
      traefik.http.routers.bothy-api-http.rule: "Host(`api.bothy.trustfall.xyz`)"
      traefik.http.routers.bothy-api-http.entrypoints: http
      traefik.http.routers.bothy-api-http.middlewares: bothy-api-https
      traefik.http.middlewares.bothy-api-https.redirectscheme.scheme: https
      traefik.http.services.bothy-api.loadbalancer.server.port: "8787"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the Next rewrites at build time — internal DNS, not the
        # public hostname, so traffic stays on bothy-internal.
        AGENT_URL: http://agent:8787
    container_name: bothy-web
    restart: unless-stopped
    env_file:
      - .env.sso
    environment:
      AGENT_URL: http://agent:8787
      PUBLIC_WEB_URL: https://bothy.trustfall.xyz
      NODE_ENV: production
    depends_on:
      - agent
    networks:
      - coolify
      - bothy-internal
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.bothy-web.rule: "Host(`bothy.trustfall.xyz`)"
      traefik.http.routers.bothy-web.entrypoints: https
      traefik.http.routers.bothy-web.tls: "true"
      traefik.http.routers.bothy-web.tls.certresolver: letsencrypt
      traefik.http.routers.bothy-web-http.rule: "Host(`bothy.trustfall.xyz`)"
      traefik.http.routers.bothy-web-http.entrypoints: http
      traefik.http.routers.bothy-web-http.middlewares: bothy-web-https
      traefik.http.middlewares.bothy-web-https.redirectscheme.scheme: https
      traefik.http.services.bothy-web.loadbalancer.server.port: "8080"

networks:
  coolify:
    external: true
  bothy-internal:
    external: true
